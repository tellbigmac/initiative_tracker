function scheduleCloudSave(){clearTimeout(cloudTimer);cloudStatus="Saving…";cloudTimer=setTimeout(cloudSave,900)}
async function cloudSave(){if(!cloudClient||!cloudUser||!cloudReady)return;try{cloudStatus="Saving…";var r=await cloudClient.from("tracker_state").upsert({user_id:cloudUser.id,data:S,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(r.error)throw r.error;cloudStatus="☁ Synced"}catch(e){cloudStatus="Cloud error";console.error(e)}}
async function cloudLoad(){if(!cloudClient||!cloudUser)return;cloudStatus="Loading cloud…";try{var r=await cloudClient.from("tracker_state").select("data,updated_at").eq("user_id",cloudUser.id).maybeSingle();if(r.error)throw r.error;if(r.data&&r.data.data){S=r.data.data;normalizeState();localStorage.setItem(KEY,JSON.stringify(S));cloudReady=true;cloudStatus="☁ Synced";ui.tab="home";render()}else{cloudReady=true;cloudStatus="Creating cloud database…";await cloudSave();render()}}catch(e){cloudReady=false;cloudStatus="Cloud error";console.error(e);render()}}
function normalizeState(){if(!S.party)S.party=[];if(!S.chars)S.chars=[];if(!S.enc)S.enc=[];if(!S.cmb)S.cmb=[];if(!S.lib)S.lib=[];if(!S.sessions)S.sessions=[];if(!S.seq)S.seq=1}

async function cloudSignOut(){if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;cloudReady=false;cloudStatus="Signed out";render()}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function order(){var p=S.cmb.filter(function(c){return c.init==null}).sort(function(a,b){return (a.t==="p"?0:1)-(b.t==="p"?0:1)||a.id-b.id});return p.concat(turns())}
function defaultTurns(){return S.cmb.filter(function(c){return c.init!=null}).sort(function(a,b){return b.init-a.init||((a.t==="p"?0:1)-(b.t==="p"?0:1))||a.id-b.id})}
function turns(){var a=defaultTurns();if(!S.turnOrder||!S.turnOrder.length)return a;var pos={};S.turnOrder.forEach(function(id,i){pos[id]=i});return a.sort(function(x,y){var px=pos[x.id],py=pos[y.id];if(px!=null&&py!=null)return px-py;if(px!=null)return -1;if(py!=null)return 1;return 0})}

function lib(){var m={};
  SEED.forEach(function(x){m[x[0].toLowerCase()]={n:x[0],ac:x[1],hp:x[2],mod:x[3],cr:x[4],u:0}});
  USER.forEach(function(x){m[x[0].toLowerCase()]={n:x[0],ac:x[1],hp:x[2],mod:x[3],cr:x[4],u:1}});
  MODS.forEach(function(g){g.m.forEach(function(x){m[g.n+"|"+x[0].toLowerCase()]={n:x[0],ac:x[1],hp:x[2],mod:x[3],cr:x[4],u:0,g:g.n}})});
  (S.lib||[]).forEach(function(x){m[x.n.toLowerCase()]={n:x.n,ac:x.ac,hp:x.hp,mod:x.mod,cr:x.cr,u:1}});
  return Object.keys(m).map(function(k){return m[k]})}
function sug(q){q=q.trim().toLowerCase();var a=actMod(),r=function(m){return m.g&&m.g===a?0:m.u?1:m.g?2:3};
  var l=lib().filter(function(m){return q?m.n.toLowerCase().indexOf(q)>=0:(m.g&&m.g===a)});
  l.sort(function(x,y){return r(x)-r(y)||(q?(x.n.toLowerCase().indexOf(q)?1:0)-(y.n.toLowerCase().indexOf(q)?1:0):0)||x.n.localeCompare(y.n)});
  return q?l.slice(0,10):l}

function sessionRoster(ss){if(!ss.roster)ss.roster=[];return ss.roster}
function calcAPL(roster){if(!roster.length)return null;var total=0,n=0;roster.forEach(function(x){if(x.level!=null){total+=Number(x.level);n++}});return n?Math.floor(total/n+0.5):null}
function partyStrength(ss){var m=findMod(ss.module),r=sessionRoster(ss),apl=calcAPL(r);if(!m||m.apl==null||apl==null)return "—";var n=r.length,rel=apl<m.apl?-1:apl>m.apl?1:0;if(n<=4)return rel<0?"Very Weak":rel===0?"Weak":"Average";if(n===5)return rel<0?"Weak":rel===0?"Average":"Strong";return rel<0?"Average":rel===0?"Strong":"Very Strong"}

d="'+c.id+'" data-f="max" value="'+val(c.max)+'"></label><label>Passive Perception<input type="number" data-s="char" data-id="'+c.id+'" data-f="pp" value="'+val(c.pp)+'"></label><label>Initiative +<input type="number" data-s="char" data-id="'+c.id+'" data-f="mod" value="'+val(c.mod||0)+'"></label></div>'+(hist.length?'<p class="mute"><b>Session history</b><br>'+hist.map(esc).join('<br>')+'</p>':'<p class="mute">No session appearances yet.</p>')+'<button data-a="rmchar" data-id="'+c.id+'">Delete character</button></details>'}).join('')+'</div>':'<p class="empty">Save a character once, then reuse and update it between sessions. Past session snapshots remain unchanged.</p>')}

function findMod(n){return MODS.filter(function(m){return m.n===n})[0]}
function today(){var d=new Date(),m=(d.getMonth()+1+"").padStart?String(d.getMonth()+1).padStart(2,"0"):(d.getMonth()+1<10?"0":"")+(d.getMonth()+1),day=String(d.getDate());if(day.length<2)day="0"+day;return d.getFullYear()+"-"+m+"-"+day} function ensureSession(){if(!S.sessions)S.sessions=[];if(!S.session){var m=findMod(actMod());var id=++S.seq;S.sessions.push({id:id,name:(m?m.code:"Session")+" — Next Session",module:actMod(),al:m?!!m.al:false,status:"planned",date:today(),created:new Date().toISOString(),roster:[]});S.session=id}var ss=get(S.sessions,S.session);if(ss&&!ss.roster)ss.roster=[];return ss}
function buildEncounterMonsters(en,comp){var m=findMod(en.module),out=[];(comp||[]).forEach(function(mm){var rec=((m&&m.m)||[]).filter(function(x){return x[0]===mm[0]})[0]||SEED.filter(function(x){return x[0]===mm[0]})[0];for(var q=0;q<mm[1];q++)out.push({id:++S.seq,name:mm[1]>1?mm[0]+" "+(q+1):mm[0],ac:rec?rec[1]:null,max:rec?rec[2]:null,mod:rec?rec[3]:0})});return out}
function loadModuleEncounters(m){if(!m||!m.enc)return; m.enc.forEach(function(e){var ss=ensureSession();if(S.enc.some(function(x){return x.session===ss.id&&x.module===m.n&&x.name===e.name}))return;var en={id:++S.seq,name:e.name,module:m.n,session:ss.id,adjust:e.adjust||"",scale:e.scale||null,scaleLevel:e.scale?"Average":null,monsters:[],ran:false};en.monsters=buildEncounterMonsters(en,e.monsters);S.enc.push(en)})}

function backupDatabase(){
  try{
    save();
    var payload={format:"initiative-tracker-backup",version:1,build:BUILD,exportedAt:new Date().toISOString(),storageKey:KEY,data:S};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),a=document.createElement("a"),d=new Date(),pad=function(n){return n<10?"0"+n:n};
    a.href=url;a.download="initiative-tracker-backup-"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000);
  }catch(e){alert("Backup failed: "+e.message)}
}
function restoreDatabaseFile(file){
  if(!file)return;var r=new FileReader();
  r.onload=function(){try{var p=JSON.parse(r.result),data=p&&p.format==="initiative-tracker-backup"?p.data:p;if(!data||typeof data!=="object"||!Array.isArray(data.cmb)||!Array.isArray(data.enc))throw new Error("This is not a valid Initiative Tracker backup.");if(!confirm("Restore this backup? This will replace the Initiative Tracker data stored in this browser."))return;S=data;if(!S.party)S.party=[];if(!S.chars)S.chars=[];if(!S.enc)S.enc=[];if(!S.cmb)S.cmb=[];if(!S.lib)S.lib=[];if(!S.sessions)S.sessions=[];if(!S.seq)S.seq=1;save();ui.tab="c";ui.stat=null;render();alert("Database restored.")}catch(e){alert("Restore failed: "+e.message)}};
  r.onerror=function(){alert("Restore failed: the backup file could not be read.")};r.readAsText(file);
}
app.addEventListener("change",function(e){if(e.target&&e.target.id==="restorefile"){restoreDatabaseFile(e.target.files&&e.target.files[0]);e.target.value=""}});

function showFatal(e){
  var a=document.getElementById("app"),x=document.getElementById("booterr");
  var msg=(e&&e.message)?e.message:String(e||"Unknown startup error");
  if(a)a.innerHTML='<div style="padding:20px;font-family:Arial,sans-serif;background:#fff;color:#222;border:2px solid #b33;border-radius:10px"><h2>Initiative Tracker could not start</h2><p>'+esc(msg)+'</p><p>This build uses a fresh local data store so older saved state cannot block startup.</p></div>';
  if(x){x.style.display="block";x.textContent="Startup error: "+msg;}
}
function boot(){
  try{
    ui.tab="home";
    render();
    initCloud();
  }catch(e){showFatal(e);}
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){setTimeout(boot,0)});}else{setTimeout(boot,0);}
